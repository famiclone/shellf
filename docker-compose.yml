version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: shellf-backend
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=file:/data/shellf.db
      - PORT=3000
      - SCREENSCRAPER_DEV_ID=${SCREENSCRAPER_DEV_ID:-}
      - SCREENSCRAPER_DEV_PASSWORD=${SCREENSCRAPER_DEV_PASSWORD:-}
      - SCREENSCRAPER_SOFTNAME=${SCREENSCRAPER_SOFTNAME:-shellf}
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: shellf-nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/frontend/public/emulator:/var/www/frontend/emulator:ro
    depends_on:
      - backend
    restart: unless-stopped
