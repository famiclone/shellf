version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: shellf-backend
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=file:/data/shellf.db
      - PORT=3100
      - SCREENSCRAPER_DEV_ID=${SCREENSCRAPER_DEV_ID:-}
      - SCREENSCRAPER_DEV_PASSWORD=${SCREENSCRAPER_DEV_PASSWORD:-}
      - SCREENSCRAPER_SOFTNAME=${SCREENSCRAPER_SOFTNAME:-shellf}
    expose:
      - "3100"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: shellf-nginx
    ports:
      - "8180:8080"
    # EmulatorJS is baked into the image at build time.
    # Optional override: mount a host dir over /var/www/frontend/emulator
    depends_on:
      - backend
    restart: unless-stopped
